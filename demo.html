<script>
// ===== src/typechart.js =====
// Full 18-type effectiveness chart. CHART[attacking][defending] = multiplier.
// Champions uses the standard modern type chart.
const TYPES = ["Normal","Fire","Water","Electric","Grass","Ice","Fighting","Poison",
  "Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Dark","Steel","Fairy"];

const C = {};
for (const a of TYPES) { C[a] = {}; for (const d of TYPES) C[a][d] = 1; }
const set = (a, pairs) => Object.assign(C[a], pairs);

set("Normal",   {Rock:.5, Ghost:0, Steel:.5});
set("Fire",     {Fire:.5, Water:.5, Grass:2, Ice:2, Bug:2, Rock:.5, Dragon:.5, Steel:2});
set("Water",    {Fire:2, Water:.5, Grass:.5, Ground:2, Rock:2, Dragon:.5});
set("Electric", {Water:2, Electric:.5, Grass:.5, Ground:0, Flying:2, Dragon:.5});
set("Grass",    {Fire:.5, Water:2, Grass:.5, Poison:.5, Ground:2, Flying:.5, Bug:.5, Rock:2, Dragon:.5, Steel:.5});
set("Ice",      {Fire:.5, Water:.5, Grass:2, Ice:.5, Ground:2, Flying:2, Dragon:2, Steel:.5});
set("Fighting", {Normal:2, Ice:2, Poison:.5, Flying:.5, Psychic:.5, Bug:.5, Rock:2, Ghost:0, Dark:2, Steel:2, Fairy:.5});
set("Poison",   {Grass:2, Poison:.5, Ground:.5, Rock:.5, Ghost:.5, Steel:0, Fairy:2});
set("Ground",   {Fire:2, Electric:2, Grass:.5, Poison:2, Flying:0, Bug:.5, Rock:2, Steel:2});
set("Flying",   {Electric:.5, Grass:2, Fighting:2, Bug:2, Rock:.5, Steel:.5});
set("Psychic",  {Fighting:2, Poison:2, Psychic:.5, Dark:0, Steel:.5});
set("Bug",      {Fire:.5, Grass:2, Fighting:.5, Poison:.5, Flying:.5, Psychic:2, Ghost:.5, Dark:2, Steel:.5, Fairy:.5});
set("Rock",     {Fire:2, Ice:2, Fighting:.5, Ground:.5, Flying:2, Bug:2, Steel:.5});
set("Ghost",    {Normal:0, Psychic:2, Ghost:2, Dark:.5});
set("Dragon",   {Dragon:2, Steel:.5, Fairy:0});
set("Dark",     {Fighting:.5, Psychic:2, Ghost:2, Dark:.5, Fairy:.5});
set("Steel",    {Fire:.5, Water:.5, Electric:.5, Ice:2, Rock:2, Steel:.5, Fairy:2});
set("Fairy",    {Fire:.5, Fighting:2, Poison:.5, Dragon:2, Dark:2, Steel:.5});

const CHART = C;

// Product of effectiveness across a defender's (1 or 2) types.
function typeMult(moveType, defTypes) {
  return defTypes.reduce((m, d) => m * CHART[moveType][d], 1);
}


// ===== src/engine.js =====
// ===========================================================================
// Pokémon Champions damage engine (Regulation M-B)
// Ported from a Python reference that was cross-checked against in-game stats.
// Level 50, IVs fixed at 31, Stat Points (SP): 0–32 per stat, 66 total.
// Gimmick: Mega Evolution only (no Tera / Dynamax in Reg M-B).
// ===========================================================================


// --- Champions stat formula (L50, 31 IVs baked in) -------------------------
//   HP    = Base + 75 + SP
//   Other = floor((Base + 20 + SP) * Nature)      Nature ∈ {1.1, 1.0, 0.9}
function statHP(base, sp)        { return base + 75 + sp; }
function statOther(base, sp, nat){ return Math.floor((base + 20 + sp) * nat); }

// Nature helper: returns {atk,def,spa,spd,spe} multipliers from "+X -Y".
const STAT_KEYS = ["atk","def","spa","spd","spe"];
function natureMults(plus, minus) {
  const m = {atk:1, def:1, spa:1, spd:1, spe:1};
  if (plus  && STAT_KEYS.includes(plus))  m[plus]  = 1.1;
  if (minus && STAT_KEYS.includes(minus)) m[minus] = 0.9;
  return m;
}

// Compute a full stat line from base stats + SP spread + nature.
// base/sp: {hp,atk,def,spa,spd,spe}; nature: {plus, minus} using atk/def/spa/spd/spe
function computeStats(base, sp, nature = {}) {
  const nm = natureMults(nature.plus, nature.minus);
  return {
    hp:  statHP(base.hp,  sp.hp ?? 0),
    atk: statOther(base.atk, sp.atk ?? 0, nm.atk),
    def: statOther(base.def, sp.def ?? 0, nm.def),
    spa: statOther(base.spa, sp.spa ?? 0, nm.spa),
    spd: statOther(base.spd, sp.spd ?? 0, nm.spd),
    spe: statOther(base.spe, sp.spe ?? 0, nm.spe),
  };
}

// Pokémon "round half down" used on damage modifiers.
function pokeRound(x) {
  return (x - Math.floor(x)) <= 0.5 ? Math.floor(x) : Math.floor(x) + 1;
}

// ---------------------------------------------------------------------------
// Damage. Returns { min, max, minPct, maxPct, typeMult, koChance }.
// Set opts to model the field. `attackStat`/`defStat` are already-computed stats.
// ---------------------------------------------------------------------------
function calcDamage({
  power,               // move base power (after any Last-Respects style scaling)
  moveType,            // e.g. "Fire"
  category,            // "phys" | "spec"
  attackerTypes,       // ["Fire","Flying"]
  defenderTypes,       // ["Grass","Fairy"]
  attackStat,          // number (already computed Atk or SpA)
  defStat,             // number (already computed Def or SpD)
  defHP,               // number (defender max HP)
  spread = false,      // doubles spread move → x0.75
  weather = null,      // "sun" | "rain" | null
  stabMult = 1.5,      // 2.0 if Adaptability
  hasSTAB = null,      // override; else auto from attackerTypes.includes(moveType)
  lifeOrb = false,     // x1.3
  toughClaws = false,  // contact move x1.3 (pass true only for contact moves)
  screen = false,      // Reflect/Light Screen halves in doubles → x0.667 (0.5 in singles)
  singles = false,     // affects screen multiplier
  otherMult = 1.0,     // catch-all (items like Fairy Feather 1.2, Pixilate 1.2, berries 0.5, etc.)
  immune = false,      // ability immunity (e.g. Levitate vs Ground) → 0 damage
}) {
  const tm = immune ? 0 : typeMult(moveType, defenderTypes);
  if (tm === 0 || power <= 0) {
    return { min:0, max:0, minPct:0, maxPct:0, typeMult:0, koChance:"immune/none" };
  }
  const L = 50;
  let base = Math.floor(Math.floor(Math.floor((2*L/5 + 2) * power * attackStat / defStat) / 50) + 2);

  let mod = base;
  if (spread) mod = pokeRound(mod * 0.75);
  if (weather === "sun")  { if (moveType==="Fire")  mod = pokeRound(mod*1.5); if (moveType==="Water") mod = pokeRound(mod*0.5); }
  if (weather === "rain") { if (moveType==="Water") mod = pokeRound(mod*1.5); if (moveType==="Fire")  mod = pokeRound(mod*0.5); }

  const stab = (hasSTAB ?? attackerTypes.includes(moveType)) ? stabMult : 1.0;

  const rolls = [];
  for (let r = 85; r <= 100; r++) {
    let d = Math.floor(mod * r / 100);
    if (stab !== 1.0)       d = pokeRound(d * stab);
    d = Math.floor(d * tm);
    if (lifeOrb)            d = pokeRound(d * 5324 / 4096);   // 1.3
    if (toughClaws)         d = pokeRound(d * 5324 / 4096);   // 1.3
    if (screen)             d = pokeRound(d * (singles ? 0.5 : 2732/4096)); // 0.667 in doubles
    if (otherMult !== 1.0)  d = pokeRound(d * otherMult);
    rolls.push(Math.max(1, d));
  }
  const min = rolls[0], max = rolls[rolls.length - 1];
  const koCount = rolls.filter(d => d >= defHP).length;
  let koChance;
  if (min >= defHP)      koChance = "guaranteed KO";
  else if (max < defHP)  koChance = "guaranteed survive";
  else                   koChance = `${Math.round(100*koCount/16)}% to KO`;

  return {
    min, max,
    minPct: +(100*min/defHP).toFixed(1),
    maxPct: +(100*max/defHP).toFixed(1),
    typeMult: tm,
    koChance,
  };
}

// Held items that boost a specific move type by 1.2x.
const ITEM_TYPE_BOOST = {
  "Black Glasses":"Dark", "Fairy Feather":"Fairy", "Charcoal":"Fire",
  "Mystic Water":"Water", "Magnet":"Electric", "Miracle Seed":"Grass",
  "Never-Melt Ice":"Ice", "Sharp Beak":"Flying", "Poison Barb":"Poison",
  "Soft Sand":"Ground", "Hard Stone":"Rock", "Silver Powder":"Bug",
  "Spell Tag":"Ghost", "Dragon Fang":"Dragon", "Metal Coat":"Steel",
  "Twisted Spoon":"Psychic", "Black Belt":"Fighting", "Silk Scarf":"Normal",
};

// Convenience: given an attacker record + a defender record + a move, calc.
// (See data/*.js for record shapes.) This is what the UI calls per matchup.
function matchup(attacker, defender, move, field = {}) {
  const aStats = attacker.stats ?? computeStats(attacker.base, attacker.sp, attacker.nature);
  const dStats = defender.stats ?? computeStats(defender.base, defender.sp, defender.nature);
  const category = move.category;
  // field.atkMult lets the UI model Intimidate (0.667), Swords Dance (2.0), etc.
  const atkMult = field.atkMult ?? 1;
  const attackStat = Math.floor((category === "phys" ? aStats.atk : aStats.spa) * atkMult);
  const defStat    = category === "phys" ? dStats.def : dStats.spd;

  // ability-driven type change (Pixilate/Aerilate/Refrigerate/Galvanize on Normal moves)
  let moveType = move.type;
  let power = move.power;
  let otherMult = move.otherMult ?? 1.0;

  // Weather Ball: Normal/50 normally; becomes the weather's type at 100 BP in weather.
  if (move.weatherBall) {
    const w = field.weather ?? attacker.setsWeather ?? null;
    const map = { sun:"Fire", rain:"Water", sand:"Rock", snow:"Ice" };
    if (w && map[w]) { moveType = map[w]; power = 100; }
    else { moveType = "Normal"; power = 50; }
  }

  if (attacker.ability === "Pixilate" && moveType === "Normal") { moveType = "Fairy"; otherMult *= 1.2; }

  // Type-boosting held items (Fairy Feather, Black Glasses, ...) → 1.2x
  if (ITEM_TYPE_BOOST[attacker.item] === moveType) otherMult *= 1.2;

  const immune = (defender.immuneTypes ?? []).includes(moveType);

  return calcDamage({
    power,
    moveType,
    category,
    attackerTypes: attacker.types,
    defenderTypes: defender.types,
    attackStat, defStat, defHP: dStats.hp,
    spread: !!move.spread && !field.singles,
    weather: field.weather ?? attacker.setsWeather ?? null,
    stabMult: attacker.ability === "Adaptability" ? 2.0 : 1.5,
    lifeOrb: attacker.item === "Life Orb",
    toughClaws: attacker.ability === "Tough Claws" && !!move.contact,
    screen: !!field.screen,
    singles: !!field.singles,
    otherMult,
    immune,
  });
}


// ===== src/data/moves.js =====
// Common Reg M-B moves. power = base power; spread = hits both foes in doubles
// (x0.75); contact = eligible for Tough Claws; otherMult = fixed extra modifier
// (e.g. item/ability bonuses baked into a specific move on a specific set).
// Verify/extend against pokemon-zone move data when adding new entries.
const MOVES = {
  // Fire
  "Heat Wave":     { type:"Fire",     category:"spec", power:95,  spread:true },
  "Overheat":      { type:"Fire",     category:"spec", power:130 },
  "Flamethrower":  { type:"Fire",     category:"spec", power:90 },

  "Close Combat":  { type:"Fighting", category:"phys", power:120, contact:true },
  "Low Kick":      { type:"Fighting", category:"phys", power:60,  contact:true, note:"scales with target weight" },
  // Ground
  "Earthquake":    { type:"Ground",   category:"phys", power:100, spread:true },
  "High Horsepower":{type:"Ground",   category:"phys", power:95,  contact:true },
  // Rock
  "Rock Slide":    { type:"Rock",     category:"phys", power:75,  spread:true },
  // Water
  "Wave Crash":    { type:"Water",    category:"phys", power:120, contact:true },
  "Aqua Jet":      { type:"Water",    category:"phys", power:40,  contact:true, priority:1 },
  "Flip Turn":     { type:"Water",    category:"phys", power:60,  contact:true },

  "Last Respects": { type:"Ghost",    category:"phys", power:100, scaling:"last_respects",

  "Knock Off":     { type:"Dark",     category:"phys", power:65,  contact:true, note:"x1.5 (97.5) if target holds a removable item" },

  // Poison
  "Dire Claw":     { type:"Poison",   category:"phys", power:80,  contact:true },
  "Sludge Bomb":   { type:"Poison",   category:"spec", power:90 },
  // Steel
  "Make It Rain":  { type:"Steel",    category:"spec", power:120, spread:true, note:"lowers user SpA after use" },
  "Iron Head":     { type:"Steel",    category:"phys", power:80,  contact:true },

  "Meteor Mash":   { type:"Steel",    category:"phys", power:90,  contact:true },
  "Bullet Punch":  { type:"Steel",    category:"phys", power:40,  contact:true, priority:1 },
  // Electric
  "Electro Shot":  { type:"Electric", category:"spec", power:130, note:"charges (instant in rain)" },
  "Thunderbolt":   { type:"Electric", category:"spec", power:90 },

  "Dragon Pulse":  { type:"Dragon",   category:"spec", power:85 },

  "Ice Punch":     { type:"Ice",      category:"phys", power:75,  contact:true },
  // Psychic / Rock (yours)

// Adjust a move's effective power for scaling moves.
function movePower(move, ctx = {}) {
  if (move.scaling === "last_respects") return 50 + 50 * (ctx.faintedAllies ?? 1);
  return move.power;
}


// ===== src/data/team.js =====

// ===== src/speed.js =====
// ===========================================================================
// Speed / turn order (Reg M-B doubles). Deterministic given known stats + field.
// This answers "do I outspeed X right now, and who moves first."
// ===========================================================================

// Stat-stage multiplier (-6..+6), used for Icy Wind / Electroweb drops, boosts.
function stageMult(stage) {
  return stage >= 0 ? (2 + stage) / 2 : 2 / (2 - stage);
}

// Effective in-battle speed for one mon given the field.
// mon: { spe (computed Spe stat), item, ability, status, side, stages:{spe}, unburdened }
// field: { tailwind:[sides...], trickRoom:bool, weather }
function effectiveSpeed(mon, field = {}) {
  let s = mon.spe;
  s = Math.floor(s * stageMult(mon.stages?.spe ?? 0));
  const w = field.weather;
  if ((mon.ability === "Swift Swim"  && w === "rain") ||
      (mon.ability === "Chlorophyll" && w === "sun")  ||
      (mon.ability === "Sand Rush"   && w === "sand") ||
      (mon.ability === "Slush Rush"  && w === "snow")) s = Math.floor(s * 2);
  if (mon.ability === "Unburden" && mon.unburdened) s = Math.floor(s * 2);
  if (mon.item === "Choice Scarf") s = Math.floor(s * 1.5);
  if (field.tailwind && field.tailwind.includes(mon.side)) s = Math.floor(s * 2);
  if (mon.status === "par") s = Math.floor(s * 0.5);
  return s;
}

// Who acts first between two mons, assuming equal move priority.
// Returns { first:"a"|"b"|"tie", aSpeed, bSpeed }.
function faster(a, b, field = {}) {
  const sa = effectiveSpeed(a, field), sb = effectiveSpeed(b, field);
  if (sa === sb) return { first: "tie", aSpeed: sa, bSpeed: sb };
  const aFirst = field.trickRoom ? sa < sb : sa > sb;   // Trick Room: slower goes first
  return { first: aFirst ? "a" : "b", aSpeed: sa, bSpeed: sb };
}

// Full turn order for any number of actions.
// actions: [{ id, mon, priority }]  (priority default 0; Prankster status +1, etc.)
// Sorts by priority bracket, then speed (reversed under Trick Room). Flags ties.
function turnOrder(actions, field = {}) {
  const withSpeed = actions.map(a => ({
    ...a,
    priority: a.priority ?? 0,
    speed: effectiveSpeed(a.mon, field),
  }));
  withSpeed.sort((x, y) => {
    if (x.priority !== y.priority) return y.priority - x.priority;       // higher priority first
    if (x.speed === y.speed) return 0;                                   // tie (order unresolved)
    return field.trickRoom ? x.speed - y.speed : y.speed - x.speed;      // TR reverses
  });
  // mark ties (same priority & speed as a neighbor)
  for (let i = 0; i < withSpeed.length; i++) {
    const a = withSpeed[i];
    a.tie = withSpeed.some((b, j) => j !== i && b.priority === a.priority && b.speed === a.speed);
  }
  return withSpeed;
}

// Speed benchmarks for a mon across common field states (for a speed-tier table).
function benchmarks(mon) {
  const base  = effectiveSpeed(mon, {});
  return {
    base,
    scarf:     effectiveSpeed({ ...mon, item: "Choice Scarf" }, {}),
    tailwind:  effectiveSpeed({ ...mon, side: "me" }, { tailwind: ["me"] }),
    minus1:    effectiveSpeed({ ...mon, stages: { spe: -1 } }, {}),   // after one Icy Wind
    paralyzed: effectiveSpeed({ ...mon, status: "par" }, {}),
  };
}

// ---- Demo UI (vanilla). Uses globals from the bundled engine + data. ----
const $ = (id) => document.getElementById(id);
const teamByName = Object.fromEntries(TEAM.map(m => [m.name, m]));

function fill(sel, items, val = (x)=>x, label = (x)=>x) {
  sel.innerHTML = "";
  for (const it of items) {
    const o = document.createElement("option");
    o.value = val(it); o.textContent = label(it); sel.appendChild(o);
  }
}

const defSel = $("defender"), thrSel = $("threat"), moveSel = $("move");
fill(defSel, TEAM, m=>m.name, m=>(m.mega ?? m.name));
fill(thrSel, THREATS, t=>t.id, t=>t.name);

function currentThreat(){ return THREATS.find(t=>t.id===thrSel.value); }

function refreshMoves(){
  const t = currentThreat();
  fill(moveSel, t.moves, m=>m, m=>m);
  moveSel.value = t.defaultMove ?? t.moves[0];
  // auto-set weather from the threat (e.g. Charizard Y → sun)
  $("weather").value = t.setsWeather ?? "none";
  renderSet(t);
  calc();
}

function renderSet(t){
  const s = computeStats(t.base, t.sp, t.nature);
  const nat = (t.nature.plus?`+${t.nature.plus} `:"") + (t.nature.minus?`-${t.nature.minus}`:"") || "neutral";
  $("setinfo").innerHTML =
    `<b>${t.name}</b> · ${t.item} · ${t.ability} · ${nat}` +
    `<br><span class="dim">stats</span> ${s.hp}/${s.atk}/${s.def}/${s.spa}/${s.spd}/${s.spe}` +
    (t.note ? `<br><span class="dim">${t.note}</span>` : "") +
    (t.conf==="std" ? `<br><span class="warn">spread = standard convention — verify for tight calcs</span>` : "");
}

function calc(){
  const d = teamByName[defSel.value];
  const t = currentThreat();
  const mv = { ...MOVES[moveSel.value], name: moveSel.value };
  mv.power = movePower(mv, { faintedAllies: +$("faints").value });

  const field = {
    weather: $("weather").value === "none" ? null : $("weather").value,
    screen: $("screen").checked,
    atkMult: $("intim").checked && mv.category === "phys" ? 2/3 : 1,
  };
  const r = matchup(t, d, mv, field);

  const dStats = computeStats(d.base, d.sp, d.nature);
  let note = "";
  // apply your defensive berry (Occa/Chople) if this hit triggers it
  if (d.berry && d.berry.type === (t.ability==="Pixilate"&&mv.type==="Normal"?"Fairy":mv.type)
      && (!d.berry.superEffOnly || r.typeMult > 1)) {
    const eff = Math.max(1, Math.round(r.max * d.berry.mult));
    note = `${d.name}'s berry halves this → ${(100*eff/dStats.hp).toFixed(0)}% max`;
  }
  if (d.item === "Focus Sash") note = "Focus Sash: survives one hit from full HP";

  // speed order between your mon and the threat, given field
  const field2 = { weather: field.weather, trickRoom: $("trickroom").checked,
                   tailwind: $("tailwind").checked ? ["me"] : [] };
  const meMon  = { spe: dStats.spe, side:"me",  item:d.item };
  const oppMon = { spe: computeStats(t.base,t.sp,t.nature).spe, side:"opp", item:t.item };
  const fr = faster(meMon, oppMon, field2);
  const who = fr.first==="tie" ? "SPEED TIE (50/50)" :
              fr.first==="a" ? `you outspeed (${fr.aSpeed} vs ${fr.bSpeed})`
                             : `they outspeed (${fr.bSpeed} vs ${fr.aSpeed})`;
  $("speed").textContent = `Speed: ${who}${field2.trickRoom?" · under Trick Room":""}${field2.tailwind.length?" · your Tailwind":""}`;

  const box = $("result");
  let verdict, cls;
  if (d.item === "Focus Sash") { verdict = "LIVES (Sash)"; cls = "live"; }
  else if (r.typeMult === 0)   { verdict = "IMMUNE"; cls = "live"; }
  else if (r.maxPct < 100)     { verdict = "LIVES"; cls = "live"; }
  else if (r.minPct >= 100)    { verdict = "DEAD"; cls = "dead"; }
  else                         { verdict = "ROLL"; cls = "roll"; }

  box.className = "result " + cls;
  box.innerHTML =
    `<div class="verdict">${verdict}</div>` +
    (r.typeMult===0 ? `<div class="range">no effect</div>` :
      `<div class="range">${r.minPct}% – ${r.maxPct}%</div>
       <div class="dim">${r.min}–${r.max} dmg vs ${dStats.hp} HP · x${r.typeMult} · ${r.koChance}</div>`) +
    (note ? `<div class="warn">${note}</div>` : "") +
    `<div class="dim small">no crit · max roll assumes 100% · ${field.weather??"no weather"}${field.screen?" · screen":""}${$("intim").checked?" · intimidate":""}</div>`;
}

["defender","move","weather","screen","intim","faints","tailwind","trickroom"].forEach(id => $(id).addEventListener("input", calc));
thrSel.addEventListener("input", refreshMoves);
refreshMoves();

</script></body></html>
